<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thistle</title>
  <link rel="apple-touch-icon" sizes="180x180" href="../../public/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../../public/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../../public/favicon/favicon-16x16.png">
  <link rel="manifest" href="../../public/favicon/site.webmanifest">
  <link rel="stylesheet" href="../styles/main.css">
  <style>
    .hero-title {
      font-size: 3rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 1rem;
    }

    .hero-subtitle {
      font-size: 1.25rem;
      color: var(--text);
      opacity: 0.8;
      margin-bottom: 2rem;
    }

    main {
      text-align: center;
      padding: 4rem 2rem;
    }

    .cta-buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 2rem;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      border: 2px solid;
      text-decoration: none;
      display: inline-block;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: transparent;
      color: var(--primary);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border-color: var(--secondary);
    }

    .btn-secondary:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    @media (max-width: 640px) {
      .hero-title {
        font-size: 2.5rem;
      }

      .cta-buttons {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-content">
      <a href="/" class="site-title">
        <img src="../../public/favicon/favicon-32x32.png" alt="Thistle logo">
        <span>Thistle</span>
      </a>
      <auth-component></auth-component>
    </div>
  </header>

  <main>
    <h1 class="hero-title">Thistle</h1>
    <p class="hero-subtitle">AI-powered audio transcription made simple</p>

    <div class="cta-buttons">
      <button id="start-btn" class="btn btn-primary">Start Transcribing</button>
    </div>
  </main>

  <script type="module" src="../components/auth.ts"></script>
  <script type="module">
    document.getElementById('start-btn').addEventListener('click', async () => {
      const authComponent = document.querySelector('auth-component');
      const isLoggedIn = await authComponent.isAuthenticated();

      if (isLoggedIn) {
        window.location.href = '/classes';
      } else {
        authComponent.openAuthModal();
      }
    });
  </script>
</body>

</html>
