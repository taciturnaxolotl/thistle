<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thistle</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🪻</text></svg>">
  <link rel="stylesheet" href="../styles/main.css">
  <style>
    main {
      max-width: 48rem;
      text-align: center;
      padding: 4rem 2rem;
    }

    .hero-title {
      font-size: 3rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 1rem;
    }

    .hero-subtitle {
      font-size: 1.25rem;
      color: var(--text);
      opacity: 0.8;
      margin-bottom: 2rem;
    }

    .cta-buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 2rem;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      border: 2px solid;
      text-decoration: none;
      display: inline-block;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: transparent;
      color: var(--primary);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border-color: var(--secondary);
    }

    .btn-secondary:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    @media (max-width: 640px) {
      .hero-title {
        font-size: 2.5rem;
      }

      .cta-buttons {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>

<body>
  <auth-component></auth-component>

  <main>
    <h1 class="hero-title">Thistle</h1>
    <p class="hero-subtitle">AI-powered audio transcription made simple</p>

    <div class="cta-buttons">
      <a href="/transcribe" class="btn btn-primary">Start Transcribing</a>
      <a href="/settings" class="btn btn-secondary">Settings</a>
    </div>
  </main>

  <script type="module" src="../components/auth.ts"></script>
</body>

</html>
