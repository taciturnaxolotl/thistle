<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Thistle</title>
  <link rel="apple-touch-icon" sizes="180x180" href="../../public/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../../public/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../../public/favicon/favicon-16x16.png">
  <link rel="manifest" href="../../public/favicon/site.webmanifest">
  <link rel="stylesheet" href="../styles/main.css">
  <style>
    main {
      max-width: 80rem;
      margin: 0 auto;
      padding: 2rem;
    }

    h1 {
      margin-bottom: 2rem;
      color: var(--text);
    }

    .section {
      margin-bottom: 3rem;
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .tabs {
      display: flex;
      gap: 1rem;
      border-bottom: 2px solid var(--secondary);
      margin-bottom: 2rem;
    }

    .tab {
      padding: 0.75rem 1.5rem;
      border: none;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-size: 1rem;
      font-weight: 500;
      font-family: inherit;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all 0.2s;
    }

    .tab:hover {
      color: var(--primary);
    }

    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--text);
      opacity: 0.6;
    }

    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--text);
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 1rem;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--background);
      border: 2px solid var(--secondary);
      border-radius: 8px;
      padding: 1.5rem;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.25rem;
    }

    .stat-label {
      color: var(--text);
      opacity: 0.7;
      font-size: 0.875rem;
    }

    .timestamp {
      color: var(--text);
      opacity: 0.6;
      font-size: 0.875rem;
    }
  </style>
</head>

<body>
  <header>
    <div class="header-content">
      <a href="/" class="site-title">
        <img src="../../public/favicon/favicon-32x32.png" alt="Thistle logo">
        <span>Thistle</span>
      </a>
      <auth-component></auth-component>
    </div>
  </header>

  <main>
    <h1>Admin Dashboard</h1>

    <div id="error-message" class="error" style="display: none;"></div>

    <div id="loading" class="loading">Loading...</div>

    <div id="content" style="display: none;">
      <div class="stats">
        <div class="stat-card">
          <div class="stat-value" id="total-users">0</div>
          <div class="stat-label">Total Users</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="total-transcriptions">0</div>
          <div class="stat-label">Total Transcriptions</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="failed-transcriptions">0</div>
          <div class="stat-label">Failed Transcriptions</div>
        </div>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="pending">Pending Recordings</button>
        <button class="tab" data-tab="transcriptions">Transcriptions</button>
        <button class="tab" data-tab="users">Users</button>
        <button class="tab" data-tab="classes">Classes</button>
      </div>

      <div id="pending-tab" class="tab-content active">
        <div class="section">
          <h2 class="section-title">Pending Recordings</h2>
          <admin-pending-recordings></admin-pending-recordings>
        </div>
      </div>

      <div id="transcriptions-tab" class="tab-content">
        <div class="section">
          <h2 class="section-title">All Transcriptions</h2>
          <admin-transcriptions id="transcriptions-component"></admin-transcriptions>
        </div>
      </div>

      <div id="users-tab" class="tab-content">
        <div class="section">
          <h2 class="section-title">All Users</h2>
          <admin-users id="users-component"></admin-users>
        </div>
      </div>

      <div id="classes-tab" class="tab-content">
        <div class="section">
          <h2 class="section-title">Manage Classes</h2>
          <admin-classes></admin-classes>
        </div>
      </div>
    </div>
  </main>

  <user-modal id="user-modal"></user-modal>
  <transcript-modal id="transcript-modal"></transcript-modal>

  <script type="module" src="../components/auth.ts"></script>
  <script type="module" src="../components/admin-pending-recordings.ts"></script>
  <script type="module" src="../components/admin-transcriptions.ts"></script>
  <script type="module" src="../components/admin-users.ts"></script>
  <script type="module" src="../components/admin-classes.ts"></script>
  <script type="module" src="../components/user-modal.ts"></script>
  <script type="module" src="../components/transcript-view-modal.ts"></script>
  <script type="module">
    const transcriptionsComponent = document.getElementById('transcriptions-component');
    const usersComponent = document.getElementById('users-component');
    const userModal = document.getElementById('user-modal');
    const transcriptModal = document.getElementById('transcript-modal');
    const errorMessage = document.getElementById('error-message');
    const loading = document.getElementById('loading');
    const content = document.getElementById('content');

    // Modal functions
    function openUserModal(userId) {
      userModal.setAttribute('open', '');
      userModal.userId = userId;
    }

    function closeUserModal() {
      userModal.removeAttribute('open');
      userModal.userId = null;
    }

    function openTranscriptModal(transcriptId) {
      transcriptModal.setAttribute('open', '');
      transcriptModal.transcriptId = transcriptId;
    }

    function closeTranscriptModal() {
      transcriptModal.removeAttribute('open');
      transcriptModal.transcriptId = null;
    }

    // Listen for component events
    transcriptionsComponent.addEventListener('open-transcription', (e) => {
      openTranscriptModal(e.detail.id);
    });

    usersComponent.addEventListener('open-user', (e) => {
      openUserModal(e.detail.id);
    });

    // Listen for modal close events
    userModal.addEventListener('close', closeUserModal);
    userModal.addEventListener('user-updated', async () => {
      await loadStats();
    });
    userModal.addEventListener('click', (e) => {
      if (e.target === userModal) closeUserModal();
    });

    transcriptModal.addEventListener('close', closeTranscriptModal);
    transcriptModal.addEventListener('transcript-deleted', async () => {
      await loadStats();
    });
    transcriptModal.addEventListener('click', (e) => {
      if (e.target === transcriptModal) closeTranscriptModal();
    });

    async function loadStats() {
      try {
        const [transcriptionsRes, usersRes] = await Promise.all([
          fetch('/api/admin/transcriptions'),
          fetch('/api/admin/users')
        ]);

        if (!transcriptionsRes.ok || !usersRes.ok) {
          if (transcriptionsRes.status === 403 || usersRes.status === 403) {
            window.location.href = '/';
            return;
          }
          throw new Error('Failed to load admin data');
        }

        const transcriptions = await transcriptionsRes.json();
        const users = await usersRes.json();

        document.getElementById('total-users').textContent = users.length;
        document.getElementById('total-transcriptions').textContent = transcriptions.length;
        
        const failed = transcriptions.filter(t => t.status === 'failed');
        document.getElementById('failed-transcriptions').textContent = failed.length;

        loading.style.display = 'none';
        content.style.display = 'block';
      } catch (error) {
        errorMessage.textContent = error.message;
        errorMessage.style.display = 'block';
        loading.style.display = 'none';
      }
    }

    // Tab switching
    function switchTab(tabName) {
      document.querySelectorAll('.tab').forEach(t => {
        t.classList.remove('active');
      });
      document.querySelectorAll('.tab-content').forEach(c => {
        c.classList.remove('active');
      });

      const tabButton = document.querySelector(`[data-tab="${tabName}"]`);
      const tabContent = document.getElementById(`${tabName}-tab`);
      
      if (tabButton && tabContent) {
        tabButton.classList.add('active');
        tabContent.classList.add('active');
        
        // Update URL without reloading
        const url = new URL(window.location.href);
        url.searchParams.set('tab', tabName);
        window.history.pushState({}, '', url);
      }
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        switchTab(tab.dataset.tab);
      });
    });

    // Check for tab query parameter on load
    const params = new URLSearchParams(window.location.search);
    const initialTab = params.get('tab');
    const validTabs = ['pending', 'transcriptions', 'users', 'classes'];
    
    if (initialTab && validTabs.includes(initialTab)) {
      switchTab(initialTab);
    }

    // Initialize
    loadStats();
  </script>
</body>

</html>
